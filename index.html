<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Star Clash: Concord vs. Verge</title>
<style>
  :root {
    --ink: #eaf2ff;
    --dim: #7f93b3;
    --panel: rgba(10, 16, 28, 0.72);
    --line: rgba(120, 170, 240, 0.25);
    --p1: #4ea8ff;
    --p2: #ffb545;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05070d; color: var(--ink); overflow: hidden; }
  #app { position: relative; width: 100vw; height: 100vh; }

  canvas { display: block; width: 100%; height: 100%; }

  /* Screen switching is driven by one data attribute on #app. */
  #fight-screen, #select-screen { position: absolute; inset: 0; }
  #app[data-screen="select"] #fight-screen { display: none; }
  #app[data-screen="fight"] #select-screen { display: none; }

  /* ---------------- Select ---------------- */
  #select-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 24px;
    background:
      radial-gradient(1100px 520px at 50% 8%, rgba(40, 92, 168, 0.30), transparent 70%),
      linear-gradient(180deg, #060b16, #04060c);
  }
  .brand { text-align: center; letter-spacing: 0.22em; }
  .brand h1 { margin: 0; font-size: clamp(20px, 3.4vw, 38px); font-weight: 700; }
  .brand p { margin: 4px 0 0; color: var(--dim); font-size: 12px; letter-spacing: 0.3em; }
  #select-stage { width: min(1120px, 96vw); height: clamp(220px, 34vh, 340px); flex: none; }
  #select-ui { width: min(1120px, 96vw); }
  .select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .select-card {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px;
    background: var(--panel); position: relative; transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .select-card.p1 { border-color: var(--p1); box-shadow: 0 0 0 1px var(--p1) inset, 0 8px 30px rgba(78,168,255,.18); }
  .select-card.p2 { border-color: var(--p2); box-shadow: 0 0 0 1px var(--p2) inset, 0 8px 30px rgba(255,181,69,.18); }
  .select-card.p1.p2 { border-color: #d08bff; }
  .select-card.locked { transform: translateY(-4px); background: rgba(18, 30, 52, .92); }
  .select-name { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .select-title { font-size: 11px; color: var(--accent); letter-spacing: .18em; margin-top: 2px; }
  .select-arch { font-size: 10px; color: var(--dim); margin: 6px 0 8px; min-height: 24px; line-height: 1.35; }
  .stat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .stat-label { font-size: 9px; color: var(--dim); width: 26px; }
  .stat-track { flex: 1; height: 5px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
  .stat-fill { height: 100%; background: linear-gradient(90deg, var(--base), var(--accent)); }
  .select-cursors { position: absolute; top: -10px; right: 8px; font-size: 10px; letter-spacing: .12em; color: var(--ink); }
  .select-hint { margin-top: 14px; text-align: center; font-size: 11px; color: var(--dim); line-height: 1.7; }
  .select-hint b { color: var(--ink); }
  .dim { opacity: .65; }

  /* ---------------- Fight ---------------- */
  #hud { position: absolute; inset: 0; pointer-events: none; padding: 14px 18px; }
  .hud-top { display: flex; align-items: flex-start; gap: 14px; }
  .hud-side { flex: 1; min-width: 0; }
  .hud-side.mirror { text-align: right; }
  .hud-head { display: flex; align-items: baseline; gap: 8px; }
  .hud-side.mirror .hud-head { flex-direction: row-reverse; }
  .hud-name { font-size: 14px; font-weight: 700; letter-spacing: .06em; }
  .hud-title { font-size: 10px; color: var(--dim); letter-spacing: .16em; }
  .hud-pips { display: flex; gap: 4px; margin-left: auto; }
  .hud-side.mirror .hud-pips { margin-left: 0; margin-right: auto; }
  .pip { width: 9px; height: 9px; border: 1px solid var(--line); border-radius: 50%; }
  .pip.on { background: #ffd479; border-color: #ffd479; }

  .bar { position: relative; height: 14px; margin-top: 5px; background: rgba(255,255,255,.07);
         border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .hud-side.mirror .bar { transform: scaleX(-1); }
  .bar-fill { position: absolute; inset: 0 auto 0 0; width: 100%; }
  .bar-fill.trail { background: #d94f4f; transition: none; }
  .bar-fill.health { background: linear-gradient(90deg, #3f8fd8, #8fd8ff); }
  .meter-wrap, .special-wrap { height: 9px; }
  .bar-fill.meter { background: linear-gradient(90deg, #8b6bd6, #d3b3ff); }
  .bar-fill.meter.full { background: linear-gradient(90deg, #ffd479, #fff3c4); }
  .bar-fill.special { background: linear-gradient(90deg, #3aa17a, #8ff0c4); }
  .bar-label { position: absolute; right: 4px; top: -1px; font-size: 7px; letter-spacing: .18em; color: rgba(255,255,255,.7); }
  .hud-side.mirror .bar-label { transform: scaleX(-1); right: auto; left: 4px; }
  .hud-status { font-size: 10px; letter-spacing: .12em; color: #ffd479; margin-top: 5px; min-height: 13px; }
  .hud-combo { font-size: 20px; font-weight: 700; color: #ff8f5e; margin-top: 4px; opacity: 0; transition: opacity .12s; }
  .hud-combo.visible { opacity: 1; }

  .hud-centre { flex: none; width: 96px; text-align: center; }
  .hud-timer { font-size: 34px; font-weight: 700; letter-spacing: .04em; }

  .hud-banner {
    position: absolute; left: 0; right: 0; top: 34%; text-align: center;
    font-size: clamp(30px, 6vw, 68px); font-weight: 700; letter-spacing: .18em;
    opacity: 0; transition: opacity .2s; text-shadow: 0 6px 40px rgba(0,0,0,.8);
  }
  .hud-banner.visible { opacity: 1; }

  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(4, 7, 13, .72); backdrop-filter: blur(3px);
  }
  #overlay.visible { display: flex; }
  .result { text-align: center; }
  .result-title { font-size: clamp(26px, 5vw, 52px); font-weight: 700; letter-spacing: .14em; }
  .result-score { font-size: 22px; color: var(--dim); margin-top: 8px; letter-spacing: .3em; }
  .result-actions { margin-top: 26px; display: flex; gap: 26px; justify-content: center; font-size: 12px; color: var(--dim); }
  .result-actions b { color: var(--ink); }

  #mode {
    position: absolute; top: 14px; right: 18px; z-index: 5;
    font: inherit; font-size: 10px; letter-spacing: .16em; padding: 6px 12px;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer;
  }
  #mode.training { border-color: #3aa17a; color: #8ff0c4; }
  #app[data-screen="fight"] #mode { display: none; }

  #perf {
    position: absolute; left: 18px; top: 96px; font-size: 10px; color: #8ff0c4;
    letter-spacing: .1em; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
  }
  #perf.visible { display: block; }
  #keys {
    position: absolute; right: 18px; bottom: 14px; font-size: 9px; color: var(--dim);
    letter-spacing: .1em; text-align: right; line-height: 1.6;
  }
  #app[data-screen="select"] #keys { display: none; }
</style>
</head>
<body>
  <div id="app" data-screen="select">
    <div id="select-screen">
      <div class="brand">
        <h1>STAR CLASH</h1>
        <p>CONCORD VS. VERGE</p>
      </div>
      <canvas id="select-stage"></canvas>
      <div id="select-ui"></div>
    </div>

    <div id="fight-screen">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="overlay"></div>
    </div>

    <button id="mode">MODE: VERSUS</button>
    <div id="perf"></div>
    <div id="keys">
      P1 &nbsp; WASD move · J light · K heavy · L special · U throw · I jump · H guard<br>
      P2 &nbsp; ARROWS move · Num1 light · Num2 heavy · Num3 special · Num4 throw · Num5 jump · Num6 guard<br>
      Down+Special = second signature move &nbsp;·&nbsp; Guard+Special = burst &nbsp;·&nbsp; F1 hitboxes &nbsp;·&nbsp; F2 perf
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
